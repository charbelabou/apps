<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Charbel's Apps</title>
  <meta name="description" content="Kezbe Bayda and Massela, Lebanese party games, on the App Store and Google Play.">
  <meta name="theme-color" content="#FFF6E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17090C" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Charbel's Apps">
  <meta property="og:description" content="Kezbe Bayda and Massela, Lebanese party games.">
  <meta property="og:url" content="https://charbelabou.github.io/apps/">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preload" as="font" type="font/woff2" href="fonts/BowlbyOne_400Regular.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="fonts/TitanOne-Regular.woff2" crossorigin>
  <style>
    /* Each card is drawn in its own app's visual language: Kezbe Bayda is the game-show sunburst with gold and
       hard shadows, Massela is the sticker style with navy outlines. Fonts are the ones the apps use. */
    @font-face { font-family: "Bowlby One"; src: url("fonts/BowlbyOne_400Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Titan One"; src: url("fonts/TitanOne-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "DM Sans"; src: url("fonts/DMSans_500Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "DM Sans"; src: url("fonts/DMSans_700Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

    :root {
      --bg: #FFF6E6;
      --muted: #6B4E53;

      --sun-a: #7C1428;
      --sun-b: #5E0D1B;
      --deep: #2A0710;
      --gold: #FFC83D;
      --cream: #FFF1D6;

      --red: #C8261C;
      --navy: #0E2B3F;
      --paper: #FFF8EC;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17090C; --muted: #CDB3B7; }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      line-height: 1.4;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    main { width: 100%; max-width: 480px; margin: 0 auto; flex: 1 0 auto; }
    a { color: inherit; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    .card {
      position: relative; overflow: hidden; isolation: isolate;
      border: 4px solid var(--edge);
      border-radius: 26px;
      padding: 20px 18px 8px;
      margin-bottom: 22px;
      box-shadow: 0 7px 0 var(--edge);
    }

    .top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
    .icon { flex: none; width: 88px; height: 88px; border-radius: 22.37%; }
    h2 { margin: 0; font-weight: 400; font-size: clamp(1.35rem, 6.2vw, 2rem); line-height: 1.05; }
    .tag { margin: 6px 0 0; font-size: 1rem; font-weight: 700; line-height: 1.3; }

    .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      display: flex; flex-direction: column; justify-content: center;
      min-height: 58px; padding: 8px 14px 8px 18px; border-radius: 999px; text-decoration: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .btn small { font-size: .68rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; line-height: 1.2; }
    .btn strong { font-size: .94rem; font-weight: 400; line-height: 1.25; white-space: nowrap; }
    a.btn:active { transform: translateY(4px); }

    .meta { display: flex; justify-content: center; gap: 24px; margin: 8px 0 0; }
    .meta a { display: inline-flex; align-items: center; min-height: 44px; font-size: .88rem; font-weight: 700; text-underline-offset: 4px; }

    /* ---------- Kezbe Bayda: sunburst, gold edge, hard deep shadow, Bowlby One ---------- */
    .kezbe { --edge: var(--gold); background: var(--sun-a); color: var(--cream); box-shadow: 0 7px 0 var(--deep); }
    .kezbe::before { /* the sunburst radiates from the app icon */
      content: ""; position: absolute; z-index: -1; left: 62px; top: 64px;
      width: 1800px; height: 1800px; margin: -900px 0 0 -900px;
      background:
        radial-gradient(circle at center, transparent 110px, rgba(26, 3, 9, .62) 440px),
        repeating-conic-gradient(var(--sun-a) 0 5deg, var(--sun-b) 5deg 10deg);
    }
    .kezbe .icon { box-shadow: 0 0 0 3px var(--gold), 0 5px 0 3px var(--deep); }
    .kezbe h2, .kezbe .btn strong { font-family: "Bowlby One", "Arial Black", system-ui, sans-serif; }
    .kezbe h2 { color: var(--gold); text-shadow: 0 3px 0 var(--deep); }
    .kezbe .btn { background: var(--gold); color: var(--deep); box-shadow: 0 5px 0 var(--deep); }
    .kezbe a.btn:active { box-shadow: 0 1px 0 var(--deep); }
    .kezbe a:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

    /* ---------- Massela: dotted red, navy outline, hard navy shadow, Titan One ---------- */
    .massela {
      --edge: var(--navy); background: var(--red); color: var(--paper);
      --outline: -2px -2px 0 var(--navy), 2px -2px 0 var(--navy), -2px 2px 0 var(--navy), 2px 2px 0 var(--navy), 0 -2px 0 var(--navy), 0 2px 0 var(--navy), -2px 0 0 var(--navy), 2px 0 0 var(--navy);
    }
    .massela::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: radial-gradient(rgba(255, 248, 236, .16) 2.2px, transparent 2.8px) 0 0 / 20px 20px;
    }
    .massela .icon { box-shadow: 0 0 0 3px var(--navy), 0 5px 0 3px var(--navy); }
    .massela h2, .massela .btn strong { font-family: "Titan One", "Arial Black", system-ui, sans-serif; }
    .massela h2 { color: var(--paper); text-shadow: var(--outline), 0 5px 0 var(--navy); }
    .massela a.btn { background: var(--paper); color: var(--navy); border: 3px solid var(--navy); box-shadow: 0 5px 0 var(--navy); }
    .massela a.btn:active { box-shadow: 0 1px 0 var(--navy); }
    .massela .btn.soon { background: transparent; color: var(--paper); border: 3px solid rgba(255, 248, 236, .6); box-shadow: none; }
    .massela a:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }

    footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: auto; padding-top: 12px; }

    @media (max-width: 359px) { .stores { grid-template-columns: 1fr; gap: 10px; } .icon { width: 72px; height: 72px; } }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <h1 class="sr-only">Charbel's Apps</h1>

  <main>
    <!--
      To add an app: copy one <section class="card …"> block, give it a colour class in the <style> above and put
      its icon in icons/. To turn a "Coming soon" button into a link: replace the <span class="btn soon"> with an
      <a class="btn" href="…"> (copy the other button).
    -->

    <section class="card kezbe" aria-labelledby="kb-name">
      <div class="top">
        <img class="icon" src="icons/kezbe-bayda.png" width="88" height="88" alt="">
        <div>
          <h2 id="kb-name">Kezbe Bayda</h2>
          <p class="tag">The game show of lies</p>
        </div>
      </div>
      <div class="stores">
        <a class="btn" href="https://apps.apple.com/app/id6816085585" aria-label="Kezbe Bayda on the App Store">
          <small>iPhone &amp; iPad</small><strong>App Store</strong>
        </a>
        <a class="btn" href="https://play.google.com/store/apps/details?id=com.kezbebayda.app" aria-label="Kezbe Bayda on Google Play">
          <small>Android</small><strong>Google Play</strong>
        </a>
      </div>
      <p class="meta">
        <a href="https://charbelabou.github.io/legal/kezbe-bayda/support.html">Support</a>
        <a href="https://charbelabou.github.io/legal/kezbe-bayda/privacy.html">Privacy</a>
      </p>
    </section>

    <section class="card massela" aria-labelledby="ms-name">
      <div class="top">
        <img class="icon" src="icons/massela.png" width="88" height="88" alt="">
        <div>
          <h2 id="ms-name">Massela</h2>
          <p class="tag">Lebanese charades</p>
        </div>
      </div>
      <div class="stores">
        <a class="btn" href="https://apps.apple.com/app/id6757847836" aria-label="Massela on the App Store">
          <small>iPhone &amp; iPad</small><strong>App Store</strong>
        </a>
        <span class="btn soon">
          <small>Android</small><strong>Coming soon</strong>
        </span>
      </div>
      <p class="meta">
        <a href="https://charbelabou.github.io/legal/massela/support.html">Support</a>
        <a href="https://charbelabou.github.io/legal/massela/privacy.html">Privacy</a>
      </p>
    </section>
  </main>

  <footer>Made by Charbel</footer>
</body>
</html>
