<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Charbel's Apps</title>
  <meta name="description" content="Kezbe Bayda and Massela, Lebanese party games, on the App Store and Google Play.">
  <meta name="theme-color" content="#F7F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120A0C" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Charbel's Apps">
  <meta property="og:description" content="Kezbe Bayda and Massela, Lebanese party games.">
  <meta property="og:url" content="https://charbelabou.github.io/apps/">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preload" as="font" type="font/woff2" href="fonts/DMSans_700Bold.woff2" crossorigin>
  <style>
    /* One typeface (the one Kezbe Bayda uses for body text), one accent per card, no borders, soft depth.
       Each card keeps its game's colour and a faint trace of its pattern. */
    @font-face { font-family: "DM Sans"; src: url("fonts/DMSans_500Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "DM Sans"; src: url("fonts/DMSans_700Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

    :root {
      --bg: #F7F1E8;
      --muted: #6B5A5C;
      --ring: rgba(0, 0, 0, .06);
      --lift: 0 1px 2px rgba(40, 10, 15, .10), 0 20px 36px -20px rgba(40, 10, 15, .50);

      --burgundy: #7C1428;
      --burgundy-deep: #650F20;
      --cream: #FFF1D6;
      --gold: #FFC83D;
      --ink: #2A0710;

      --red: #C8261C;
      --red-deep: #AF2017;
      --paper: #FFF8EC;
      --navy: #0E2B3F;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #120A0C; --muted: #B9A5A9; --ring: rgba(255, 255, 255, .08); --lift: 0 0 0 transparent; }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      line-height: 1.4;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    main { width: 100%; max-width: 480px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; }
    a { color: inherit; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    .card {
      position: relative; overflow: hidden; isolation: isolate;
      border-radius: 28px; padding: 24px; margin: 0 0 16px;
      box-shadow: 0 0 0 1px var(--ring), var(--lift);
    }

    .top { display: flex; align-items: center; gap: 16px; }
    .icon {
      flex: none; width: 80px; height: 80px; border-radius: 22.37%;
      outline: 1px solid rgba(255, 255, 255, .16); outline-offset: -1px;
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, .45);
    }
    h2 { margin: 0; font-size: 1.65rem; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
    .tag { margin: 5px 0 0; font-size: .95rem; line-height: 1.3; }

    .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 52px; padding: 0 12px; border-radius: 14px;
      font-size: .95rem; font-weight: 700; text-decoration: none; white-space: nowrap;
      transition: transform 120ms ease, filter 120ms ease;
    }
    .btn small { font-size: .78rem; font-weight: 500; }
    a.btn:active { transform: scale(.98); filter: brightness(.94); }

    .meta { display: flex; gap: 22px; margin: 8px 0 -8px; }
    .meta a { display: inline-flex; align-items: center; min-height: 44px; font-size: .85rem; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: rgba(255, 255, 255, .45); }

    /* ---------- Kezbe Bayda: burgundy and cream, gold only on the buttons ---------- */
    .kezbe { background: linear-gradient(170deg, var(--burgundy), var(--burgundy-deep)); color: var(--cream); }
    .kezbe::before { /* a faint sunburst from the icon, the game's pattern at a whisper */
      content: ""; position: absolute; z-index: -1; inset: 0;
      background: repeating-conic-gradient(from 0deg at 64px 64px, rgba(255, 255, 255, .045) 0 5deg, transparent 5deg 10deg);
      -webkit-mask-image: radial-gradient(circle 440px at 64px 64px, #000, transparent);
      mask-image: radial-gradient(circle 440px at 64px 64px, #000, transparent);
    }
    .kezbe .btn { background: var(--gold); color: var(--ink); }
    .kezbe a:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

    /* ---------- Massela: red and paper, navy on the buttons ---------- */
    .massela { background: linear-gradient(170deg, var(--red), var(--red-deep)); color: var(--paper); }
    .massela::before { /* faint dots from the corner, the game's pattern at a whisper */
      content: ""; position: absolute; z-index: -1; inset: 0;
      background: radial-gradient(rgba(255, 255, 255, .13) 1.5px, transparent 2px) 0 0 / 18px 18px;
      -webkit-mask-image: linear-gradient(to left, #000, transparent 75%);
      mask-image: linear-gradient(to left, #000, transparent 75%);
    }
    .massela a.btn { background: var(--paper); color: var(--navy); }
    .massela .btn.soon { background: rgba(255, 255, 255, .12); color: var(--paper); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .32); }
    .massela a:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }

    footer { text-align: center; color: var(--muted); font-size: .85rem; padding-top: 12px; }

    @media (max-width: 359px) { .stores { grid-template-columns: 1fr; } .icon { width: 68px; height: 68px; } .card { padding: 20px; } }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <h1 class="sr-only">Charbel's Apps</h1>

  <main>
    <!--
      To add an app: copy one <section class="card …"> block, give it a colour class in the <style> above and put
      its icon in icons/. To turn a "Coming soon" button into a link: replace the <span class="btn soon"> with an
      <a class="btn" href="…"> (copy the other button).
    -->

    <section class="card kezbe" aria-labelledby="kb-name">
      <div class="top">
        <img class="icon" src="icons/kezbe-bayda.png" width="80" height="80" alt="">
        <div>
          <h2 id="kb-name">Kezbe Bayda</h2>
          <p class="tag">The game show of lies</p>
        </div>
      </div>
      <div class="stores">
        <a class="btn" href="https://apps.apple.com/app/id6816085585" aria-label="Kezbe Bayda on the App Store">App Store</a>
        <a class="btn" href="https://play.google.com/store/apps/details?id=com.kezbebayda.app" aria-label="Kezbe Bayda on Google Play">Google Play</a>
      </div>
      <p class="meta">
        <a href="https://charbelabou.github.io/legal/kezbe-bayda/support.html">Support</a>
        <a href="https://charbelabou.github.io/legal/kezbe-bayda/privacy.html">Privacy</a>
      </p>
    </section>

    <section class="card massela" aria-labelledby="ms-name">
      <div class="top">
        <img class="icon" src="icons/massela.png" width="80" height="80" alt="">
        <div>
          <h2 id="ms-name">Massela</h2>
          <p class="tag">Lebanese charades</p>
        </div>
      </div>
      <div class="stores">
        <a class="btn" href="https://apps.apple.com/app/id6757847836" aria-label="Massela on the App Store">App Store</a>
        <span class="btn soon">Google Play <small>soon</small></span>
      </div>
      <p class="meta">
        <a href="https://charbelabou.github.io/legal/massela/support.html">Support</a>
        <a href="https://charbelabou.github.io/legal/massela/privacy.html">Privacy</a>
      </p>
    </section>
  </main>

  <footer>Made by Charbel</footer>
</body>
</html>
